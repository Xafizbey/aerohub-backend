upstream aerohub_api {
    server api:8000;
}

# Subdomain: cinema.asmanairlines.com.kg → FastAPI root
server {
    listen 80;
    server_name cinema.asmanairlines.com.kg;

    client_max_body_size 100M;

    location /media/ {
        alias /app/media/;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin *;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
    }

    location / {
        proxy_pass         http://aerohub_api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name asmanairlines.com.kg www.asmanairlines.com.kg;

    client_max_body_size 100M;

    # Aerohub IFE — all requests under /cinema proxied to FastAPI
    location /cinema/ {
        proxy_pass         http://aerohub_api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /cinema;
        proxy_read_timeout 120s;
    }

    # Media files served directly for performance (HLS, posters, audio)
    location /cinema/media/ {
        alias /app/media/;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin *;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
    }

    # Redirect bare /cinema to /cinema/
    location = /cinema {
        return 301 /cinema/;
    }
}
