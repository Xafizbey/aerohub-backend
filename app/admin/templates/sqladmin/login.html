{% extends "sqladmin/base.html" %}

{% block head %}
<style>
  :root {
    --ah-font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --ah-blue: #3b82f6;
    --ah-glow: rgba(59,130,246,0.25);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: var(--ah-font) !important;
    background: #07101f !important;
    -webkit-font-smoothing: antialiased;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Stars / background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(59,130,246,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(6,182,212,0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  .ah-login-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 1.5rem;
  }

  /* Logo */
  .ah-login-logo {
    text-align: center;
    margin-bottom: 2rem;
  }

  .ah-login-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 60px; height: 60px;
    border-radius: 16px;
    background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
    font-size: 1.75rem;
    box-shadow: 0 0 30px rgba(59,130,246,0.5);
    margin-bottom: 1rem;
  }

  .ah-login-title {
    font-size: 1.5rem;
    font-weight: 800;
    background: linear-gradient(135deg, #93c5fd, #67e8f9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
    margin: 0 0 0.25rem;
  }

  .ah-login-subtitle {
    font-size: 0.8rem;
    color: #3d5278;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  /* Card */
  .ah-login-card {
    background: #111827;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    padding: 2rem;
    box-shadow:
      0 4px 6px rgba(0,0,0,0.3),
      0 20px 60px rgba(0,0,0,0.5),
      0 0 0 1px rgba(59,130,246,0.05) inset;
    position: relative;
    overflow: hidden;
  }

  .ah-login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(99,157,255,0.4), transparent);
  }

  /* Form */
  .ah-form-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 0.4rem;
  }

  .ah-form-input {
    width: 100%;
    padding: 0.6rem 0.85rem;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: #d1dae8;
    font-size: 0.9rem;
    font-family: var(--ah-font);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .ah-form-input:focus {
    border-color: var(--ah-blue);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.18);
    background: rgba(0,0,0,0.45);
  }

  .ah-form-input::placeholder { color: #3d5278; }

  .ah-form-input.is-invalid {
    border-color: rgba(239,68,68,0.5);
  }

  .ah-error-msg {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.6rem;
    padding: 0.55rem 0.75rem;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 7px;
    color: #fca5a5;
    font-size: 0.8rem;
  }

  .ah-submit-btn {
    width: 100%;
    padding: 0.65rem;
    margin-top: 1.5rem;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border: none;
    border-radius: 9px;
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: var(--ah-font);
    cursor: pointer;
    letter-spacing: 0.2px;
    box-shadow: 0 4px 16px rgba(59,130,246,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .ah-submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(59,130,246,0.45);
  }

  .ah-submit-btn:active { transform: translateY(0); }

  .ah-form-group { margin-bottom: 1rem; }
</style>
{% endblock %}

{% block body %}
<div class="ah-login-wrap">

  <div class="ah-login-logo">
    <div class="ah-login-icon">✈</div>
    <div class="ah-login-title">AeroHub</div>
    <div class="ah-login-subtitle">Admin Panel</div>
  </div>

  <div class="ah-login-card">
    <form action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">

      <div class="ah-form-group">
        <label class="ah-form-label">Email or Username</label>
        <input
          name="username"
          type="text"
          class="ah-form-input {% if error %}is-invalid{% endif %}"
          placeholder="admin@aerohub.local"
          autocomplete="off"
          autofocus
        >
      </div>

      <div class="ah-form-group">
        <label class="ah-form-label">Password</label>
        <input
          name="password"
          type="password"
          class="ah-form-input {% if error %}is-invalid{% endif %}"
          placeholder="••••••••••"
          autocomplete="off"
        >
      </div>

      {% if error %}
      <div class="ah-error-msg">
        <i class="fa fa-circle-exclamation fa-xs"></i>
        {{ error }}
      </div>
      {% endif %}

      <button type="submit" class="ah-submit-btn">
        Sign In →
      </button>

    </form>
  </div>

</div>
{% endblock %}
